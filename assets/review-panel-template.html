<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验报告审核面板</title>
<style>
:root{--ink:#183149;--muted:#62758a;--paper:#fff;--bg:#eef4f8;--blue:#205b88;--cyan:#e6f4fb;--line:#ccdae5;--green:#14735a;--amber:#a36300;--red:#a33c3c;--shadow:0 10px 32px rgba(31,78,120,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#173f63,#2479a4);color:#fff;box-shadow:var(--shadow)}
.top-inner{max-width:1900px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:18px}.title{font-size:22px;font-weight:750;white-space:nowrap}.sub{opacity:.82;font-size:13px}
.top select{margin-left:auto;min-width:320px;padding:9px 12px;border-radius:9px;border:1px solid #ffffff55;background:#fff;color:var(--ink)}
.batch-bar{max-width:1900px;margin:14px auto 0;padding:0 22px}.batch-box{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:11px 14px;display:grid;grid-template-columns:minmax(260px,1.4fr) minmax(180px,.6fr) auto;gap:10px;align-items:end}.batch-box label{margin:0 0 3px}.batch-box input,.batch-box select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.inspection-settings{grid-column:1/-1;display:flex;gap:18px;align-items:end;padding-top:2px}.inspection-mode{width:min(420px,100%)}.auto-upgrade{display:inline-flex!important;align-items:center;gap:7px;margin:0 0 9px!important;color:var(--muted)!important;font-weight:600!important}.auto-upgrade input{width:16px;height:16px}.batch-meta{grid-column:1/-1;color:var(--muted);font-size:12px}.batch-box .btn{height:40px}
.batch-info{grid-column:1/-1;margin-top:2px;border:1px solid #b9d9eb;background:#f1f8fc;border-radius:10px;padding:9px 13px;color:#385970;font-size:13px}
.batch-info strong{display:block;margin-bottom:3px;color:var(--blue)}
.batch-info ul{margin:3px 0 0;padding-left:19px}.batch-info li{margin:1px 0}
.layout{max-width:1900px;margin:22px auto;padding:0 22px;display:grid;grid-template-columns:240px minmax(560px,1fr) minmax(430px,40vw);gap:18px}.side,.main-card,.pdf-pane{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.side{align-self:start;position:sticky;top:92px;overflow:hidden}.side-head{padding:18px;border-bottom:1px solid var(--line)}.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px}.report-list{max-height:calc(100vh - 190px);overflow:auto}
.report-row{display:block;width:100%;padding:13px 16px;text-align:left;border:0;border-bottom:1px solid #e7eef3;background:#fff;color:var(--ink)}.report-row:hover,.report-row.active{background:var(--cyan)}.report-row strong{display:block}.report-row small{color:var(--muted)}
.main-card{padding:24px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:18px}.hero h1{margin:0 0 5px;font-size:27px}.meta{color:var(--muted)}
.score-box{min-width:150px;background:#f1f8fc;border:1px solid #b9d9eb;border-radius:14px;padding:12px 18px;text-align:center}.score-box output{display:block;font-size:34px;font-weight:800;color:var(--blue);line-height:1.2}.score-box .adjusted-state{display:block;margin-top:2px;font-size:13px;font-weight:700;color:#1b6b3a}.score-box .adjusted-state b{font-size:16px}.status{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:99px;background:#fff0d5;color:var(--amber);font-size:12px;font-weight:700}.status.approved{background:#e1f4ec;color:var(--green)}
.notice{margin:18px 0;padding:12px 15px;border-left:4px solid #4c9ac4;background:#f0f8fc;color:#385970}.rubric-tools{display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px}.rubric-tools h2{font-size:18px;margin:0}.rubric-grid{display:grid;gap:9px}.rubric{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}.rubric summary{list-style:none;padding:11px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}.rubric summary::-webkit-details-marker{display:none}.rubric summary:before{content:'▸';color:var(--muted);transition:transform .15s}.rubric[open] summary:before{transform:rotate(90deg)}.rubric h3{font-size:15px;margin:0;flex:1}.rubric-detail{padding:0 15px 14px;border-top:1px solid #edf2f5}.score-input{display:flex;align-items:center;gap:5px;white-space:nowrap}.score-input input{width:74px;padding:7px;text-align:right;border:1px solid #aebfcd;border-radius:8px;font-weight:700;color:var(--blue)}
label{display:block;margin:15px 0 6px;font-size:13px;font-weight:700;color:#45627a}textarea{width:100%;min-height:86px;padding:10px;border:1px solid var(--line);border-radius:9px;resize:vertical;background:#fbfdfe;color:var(--ink)}.evidence{margin:7px 0 0;padding-left:19px;color:#50687b;font-size:13px}.evidence li+li{margin-top:3px}
.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 10px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.warnings{background:#fff9ed;border:1px solid #efd7a2;border-radius:11px;padding:12px 15px;color:#79520f}.warnings ul{margin:5px 0;padding-left:20px}.actions{position:sticky;bottom:14px;margin-top:22px;padding:12px;background:#ffffffed;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.action-main{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.approval-option{display:flex;justify-content:flex-end;border-top:1px solid #e7eef3;margin-top:10px;padding-top:9px}.skip-confirm{display:inline-flex;align-items:center;gap:9px;margin:0;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}.skip-confirm input{position:absolute;opacity:0;pointer-events:none}.skip-switch{width:32px;height:18px;border-radius:99px;background:#c7d3dc;position:relative;transition:.18s}.skip-switch:after{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.18s}.skip-confirm input:checked+.skip-switch{background:var(--green)}.skip-confirm input:checked+.skip-switch:after{transform:translateX(14px)}.skip-confirm input:focus-visible+.skip-switch{outline:3px solid #8fc7e6;outline-offset:2px}
.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.ghost{background:#eaf1f6;color:var(--ink)}.copy-status{align-self:center;color:var(--green);font-size:13px}.empty{padding:24px;color:var(--muted)}
.pdf-pane{align-self:start;position:sticky;top:92px;height:calc(100vh - 114px);overflow:hidden;display:flex;flex-direction:column}.pdf-head{min-height:54px;padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.pdf-head h2{font-size:15px;margin:0}.pdf-head span{color:var(--muted);font-size:12px}.pdf-head a{margin-left:auto;color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}.pdf-head a:hover{text-decoration:underline}.pdf-pane iframe{border:0;width:100%;flex:1;background:#dfe6eb}.pdf-fallback{display:none;padding:18px;color:var(--muted)}
@media(max-width:1300px){.layout{grid-template-columns:minmax(0,1fr) minmax(380px,48vw)}.side{grid-column:1/-1;position:static}.side-head{padding:12px}.report-list{display:flex;max-height:none;overflow-x:auto}.report-row{min-width:210px;border-right:1px solid #e7eef3}.pdf-pane{grid-column:2;grid-row:2}.main-card{grid-column:1;grid-row:2}}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side,.main-card,.pdf-pane{grid-column:1;grid-row:auto;position:static}.pdf-pane{height:76vh}.top-inner{flex-wrap:wrap}.top select{margin-left:0;width:100%;min-width:0}.cols{grid-template-columns:1fr}.batch-box{grid-template-columns:1fr}.inspection-settings{grid-column:1;display:grid;gap:4px}.batch-meta{grid-column:1}.approval-option{justify-content:flex-start}}
@media print{.top,.side,.actions,.notice,.pdf-pane{display:none}.layout{display:block;margin:0;padding:0}.main-card{border:0;box-shadow:none}.rubric-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><div><div class="title">实验报告审核面板</div><div class="sub">选择实验批次 · 快速审核总分与评语 · 原始 PDF 对照</div></div><select id="quickSelect" aria-label="选择报告"></select></div></header>
<section class="batch-bar"><div class="batch-box"><div><label for="reportDir">实验报告文件夹</label><input id="reportDir" list="reportDirOptions" autocomplete="off" placeholder="输入路径，或点击右侧箭头选择"><datalist id="reportDirOptions"></datalist></div><div><label for="batchName">实验批次名称</label><input id="batchName" placeholder="例如 2026秋-实验1"></div><button class="btn primary" id="selectBatch">加载 / 创建批次</button><div class="inspection-settings"><div class="inspection-mode"><label for="inspectionMode">报告检查模式</label><select id="inspectionMode"><option value="text_only" selected>仅检查文字（默认，节省 token）</option><option value="smart">智能检查（文字 + 重点图片）</option><option value="full_visual">完整检查文字和图片</option></select></div><label class="auto-upgrade"><input type="checkbox" id="autoUpgradeVisual">关键内容主要在图片中时自动升级检查</label></div><div class="batch-meta" id="batchMeta">首次使用默认只检查文字；可在这里自行选择是否检查图片。</div><div class="batch-info" id="batchInfo" hidden></div></div></section>
<div class="layout"><aside class="side"><div class="side-head"><input id="search" class="search" placeholder="搜索姓名、学号或文件名"></div><div id="reportList" class="report-list"></div></aside><main id="main" class="main-card"></main><section class="pdf-pane" aria-label="实验报告 PDF"><div class="pdf-head"><div><h2>当前源 PDF</h2><span id="pdfName"></span></div><a id="openPdf" target="_blank" rel="noreferrer">新窗口打开</a></div><iframe id="pdfFrame" title="实验报告 PDF"></iframe><div class="pdf-fallback">当前浏览器无法内嵌 PDF，请点击“新窗口打开”。</div></section></div>
<script>
let reviews=__REVIEWS_JSON__; let batchNotices=__BATCH_NOTICES_JSON__; let active=0; let pdfRevision=0;
let serverConfig=null; let batchNameTouched=false; let autoBatchName="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const listText=a=>(a||[]).join("\n");
function renderFigureEvidence(d){return (d.figures||[]).length?'<ul class="evidence">'+d.figures.map(f=>'<li>'+esc(f.id)+'：'+esc(f.reason)+'（'+esc((f.requirements||[]).join(', '))+'）</li>').join('')+'</ul>':'';}
function renderRegradeDispute(r){const d=r.regrade_dispute;if(!d)return '';const ledger=entries=>(entries||[]).length?'<ul>'+entries.map(x=>'<li>'+esc(x.rule)+' −'+esc(x.points)+'分 · '+esc((x.requirements||[]).join(', '))+'：'+esc(x.reason)+'（'+esc((x.evidence||[]).join(', '))+'）'+renderFigureEvidence(x)+'</li>').join('')+'</ul>':'<p>没有扣分事实</p>';return '<section class="section warnings"><details><summary>两次盲评依据对比（'+esc(d.primary_total)+' / '+esc(d.recheck_total)+'分）</summary><h3>首次</h3>'+ledger(d.primary_deductions)+'<h3>复评</h3>'+ledger(d.recheck_deductions)+'</details></section>';}
function pdfUrl(r){if(serverConfig)return '/api/pdf?review_file='+encodeURIComponent(r.__review_file);const source=String(r.source_file||"").replace(/\\/g,"/");if(/^file:/i.test(source))return source;if(/^[A-Za-z]:\//.test(source)){const parts=source.split("/");return "file:///"+parts.map((part,i)=>i===0?part:encodeURIComponent(part)).join("/")}const encoded=source.split("/").map(encodeURIComponent).join("/");return new URL(encoded,new URL("../../",location.href)).href}
function updatePdf(r){const base=pdfUrl(r);const url=base+(base.includes('?')?'&':'?')+'v='+pdfRevision;document.getElementById("pdfFrame").src=url;document.getElementById("openPdf").href=url;document.getElementById("pdfName").textContent=r.student_name+' · '+r.student_id}
function total(r){return r.items.reduce((s,x)=>s+(Number(x.score)||0),0)}
const fmtScore=v=>Number(v).toFixed(1).replace(/\.0$/,"");
function adjusted(r){const off=Number(r.score_offset)||0;if(!(off>0))return null;return Math.min(Number(r.max_score),total(r)+off)}
function syncFromForm(){const r=reviews[active];if(!r)return;document.querySelectorAll("[data-score]").forEach(el=>r.items[+el.dataset.score].score=Math.max(0,Math.min(Number(el.max),Number(el.value)||0)));document.querySelectorAll("[data-comment]").forEach(el=>r.items[+el.dataset.comment].comment=el.value);const overall=document.querySelector('[data-field="overall_comment"]');if(overall)r.overall_comment=overall.value;const resolve=document.getElementById("resolveDispute");if(resolve)r.adjudication_acknowledged=resolve.checked;r.total_score=total(r);const adj=adjusted(r);r.adjusted_total=adj===null?undefined:adj;const totalEl=document.getElementById("total");if(totalEl)totalEl.textContent=fmtScore(r.total_score);const adjEl=document.getElementById("adjusted");if(adjEl)adjEl.textContent=adj===null?"":fmtScore(adj)}
function renderList(filter=""){const q=filter.trim().toLowerCase();const box=document.getElementById("reportList");box.innerHTML="";reviews.forEach((r,i)=>{const hay=[r.student_name,r.student_id,r.source_file].join(" ").toLowerCase();if(q&&!hay.includes(q))return;const b=document.createElement("button");b.className="report-row"+(i===active?" active":"");const status=r.review_status==="approved"?"已审核":r.adjudication_status==="required"?"待裁决":"待审核";b.innerHTML='<strong>'+esc(r.student_name)+' · '+esc(r.total_score)+'</strong><small>'+esc(r.student_id)+' · '+status+'</small>';b.onclick=()=>{syncFromForm();active=i;pdfRevision=Date.now();render()};box.appendChild(b)});if(!box.children.length)box.innerHTML='<div class="empty">没有匹配的报告</div>'}
function render(){const r=reviews[active];renderBatchNotices();const select=document.getElementById("quickSelect");select.innerHTML=reviews.map((x,i)=>'<option value="'+i+'" '+(i===active?'selected':'')+'>'+esc(x.student_name)+' · '+esc(x.student_id)+'</option>').join("");select.disabled=!reviews.length;renderList(document.getElementById("search").value);if(!r){document.getElementById("main").innerHTML='<div class="empty"><h2>该批次尚无评分草稿</h2><p>报告文件夹已经登记。请回到当前 Codex 对话，发送“使用 experiment-report-grader Skill，批改当前审核面板选择的批次并生成草稿”。完成后刷新本页即可直接审核。</p></div>';document.getElementById("pdfFrame").removeAttribute("src");document.getElementById("openPdf").removeAttribute("href");document.getElementById("pdfName").textContent='等待评分草稿';return}updatePdf(r);const scoreStep=serverConfig?.batch?.score_increment||1;const disputed=r.adjudication_status==="required";const cards=r.items.map((x,i)=>'<details class="rubric"><summary><h3>'+esc(x.criterion)+'</h3><div class="score-input"><input type="number" step="'+esc(scoreStep)+'" min="0" max="'+esc(x.max_score)+'" value="'+esc(x.score)+'" data-score="'+i+'" aria-label="'+esc(x.criterion)+'分数" onclick="event.stopPropagation()"> / '+esc(x.max_score)+'</div></summary><div class="rubric-detail">'+(x.score_rule?'<p><strong>固定评分规则：</strong>'+esc(x.score_rule)+' · '+esc(x.score_rule_description||'')+'</p>':'')+((x.deductions||[]).length?'<p><strong>证据扣分：</strong></p><ul class="evidence">'+x.deductions.map(d=>'<li>-'+esc(d.points)+'：'+esc(d.reason)+'（'+esc(d.fact)+'）'+renderFigureEvidence(d)+'</li>').join("")+'</ul>':'')+'<label>评分说明</label><textarea data-comment="'+i+'">'+esc(x.comment)+'</textarea><label>页码证据</label><ul class="evidence">'+(x.evidence||[]).map(e=>'<li>'+esc(e)+'</li>').join("")+'</ul>'+((x.visual_evidence||[]).length?'<label>视觉核验页</label><ul class="evidence">'+x.visual_evidence.map(e=>'<li>'+esc(e)+'</li>').join("")+'</ul>':'')+'</div></details>').join("");
const actionButtons=serverConfig?'<button class="btn primary" id="saveDraft">保存分数和评语</button><button class="btn success" id="approveDirect" '+(disputed&&!r.adjudication_acknowledged?'disabled':'')+'>批准并写回源 PDF</button>':'<a class="btn primary" href="http://127.0.0.1:8765/" target="_blank" rel="noreferrer">打开可直接保存的审核页面</a><button class="btn ghost" id="copyChanges">离线复制修改指令</button>';const disputeOption=serverConfig&&disputed?'<div class="approval-option"><label><input type="checkbox" id="resolveDispute" '+(r.adjudication_acknowledged?'checked':'')+'> 我已核对两次评分的分歧，并确认当前分数作为裁决结果</label></div>':'';const approvalOption=serverConfig?disputeOption+'<div class="approval-option"><label class="skip-confirm"><input type="checkbox" id="skipConfirm"><span class="skip-switch" aria-hidden="true"></span><span>连续审核模式：本批次不再确认</span></label></div>':'';const notice=serverConfig?'修改后可直接保存草稿和 Excel；批准时系统先备份原件，再把精简反馈页写回当前源 PDF。':'这是离线存档页面，不能直接修改本地文件。请打开本地审核服务页面进行保存和批准。';
const statusLabel=r.review_status==="approved"?'已审核':disputed?'待裁决':'待审核草稿';document.getElementById("main").innerHTML='<div class="hero"><div><h1>'+esc(r.student_name)+'</h1><div class="meta">学号 '+esc(r.student_id)+' · '+esc(r.experiment||"")+'<br>'+esc(r.source_file)+'</div></div><div class="score-box"><output id="total">'+esc(total(r))+'</output><span>'+(adjusted(r)===null?'满分 ':'批改得分 · 满分 ')+esc(r.max_score)+'</span>'+(adjusted(r)===null?'':'<span class="adjusted-state">最终成绩 <b id="adjusted">'+esc(fmtScore(adjusted(r)))+'</b>（+'+esc(fmtScore(Number(r.score_offset)))+'）</span>')+'<div class="status '+(r.review_status==="approved"?'approved':'')+'">'+statusLabel+'</div></div></div><div class="notice">'+notice+'</div><section class="section"><h2>综合评语</h2><textarea data-field="overall_comment" style="min-height:150px">'+esc(r.overall_comment)+'</textarea></section>'+(r.warnings?.length?'<section class="section warnings"><strong>需要教师复核</strong><ul>'+r.warnings.map(w=>'<li>'+esc(w)+'</li>').join("")+'</ul></section>':'')+renderRegradeDispute(r)+'<div class="rubric-tools"><h2>分项分数</h2><button class="btn ghost" id="toggleRubrics">展开全部</button></div><div class="rubric-grid">'+cards+'</div><div class="actions"><div class="action-main">'+actionButtons+'<button class="btn ghost" onclick="window.print()">打印 / 保存为 PDF</button><span class="copy-status" id="copyStatus"></span></div>'+approvalOption+'</div>';
document.querySelectorAll("input,textarea").forEach(el=>el.addEventListener("input",syncFromForm));document.getElementById("toggleRubrics").onclick=()=>{const details=[...document.querySelectorAll('.rubric')];const open=details.some(item=>!item.open);details.forEach(item=>item.open=open);document.getElementById("toggleRubrics").textContent=open?'折叠全部':'展开全部'};if(serverConfig){const skip=document.getElementById("skipConfirm");const skipKey='skip-approval-confirm:'+serverConfig.batch.batch_id;skip.checked=sessionStorage.getItem(skipKey)==='1';skip.onchange=()=>sessionStorage.setItem(skipKey,skip.checked?'1':'0');const resolve=document.getElementById("resolveDispute");if(resolve)resolve.onchange=()=>{r.adjudication_acknowledged=resolve.checked;document.getElementById("approveDirect").disabled=!resolve.checked};document.getElementById("saveDraft").onclick=()=>saveDirect(false);document.getElementById("approveDirect").onclick=()=>saveDirect(true)}else{document.getElementById("copyChanges")?.addEventListener("click",()=>copyCommand(false))}}
async function copyText(value){try{await navigator.clipboard.writeText(value)}catch{const t=document.createElement("textarea");t.value=value;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}}
async function copyCommand(approve){syncFromForm();const r=reviews[active];const items=r.items.map(x=>'－'+x.criterion+'：'+x.score+'/'+x.max_score+'；评语：'+x.comment).join("\n");const action=approve?'请把以下修改写回对应 review JSON，重新生成 Excel 和审核 HTML；我明确批准这个版本，并授权先备份原件、再把反馈页写回该源 PDF。':'请把以下修改写回对应 review JSON，并重新生成 Excel 和审核 HTML；不要写入 PDF。';const command='使用 experiment-report-grader Skill。\n'+action+'\n学生：'+r.student_name+'（'+r.student_id+'）\n源文件：'+r.source_file+'\n分项：\n'+items+'\n总分：'+r.total_score+'/'+r.max_score+'\n综合评语：'+r.overall_comment;await copyText(command);const s=document.getElementById("copyStatus");s.textContent="已复制，回到 Codex 粘贴发送即可";setTimeout(()=>s.textContent="",3500)}
async function saveDirect(approve){syncFromForm();const r=reviews[active];const skipConfirm=document.getElementById("skipConfirm")?.checked===true;if(approve&&!skipConfirm&&!confirm('确认批准 '+r.student_name+'（'+r.student_id+'）当前的 '+r.total_score+' 分版本，并写回源 PDF？系统会先在当前批次保存原件备份。'))return;const status=document.getElementById("copyStatus");const buttons=document.querySelectorAll('.actions button');buttons.forEach(button=>button.disabled=true);status.textContent=approve?'正在备份原件并写回源 PDF…':'正在保存草稿并更新 Excel…';try{const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':serverConfig.token},body:JSON.stringify({action:approve?'approve_and_generate':'save_draft',review_file:r.__review_file,review:r})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'保存失败');const completedIndex=active;reviews[active]=result.review;let moved=false;if(approve){const nextAfter=reviews.findIndex((item,index)=>index>completedIndex&&item.review_status!=="approved");const nextBefore=reviews.findIndex((item,index)=>index<completedIndex&&item.review_status!=="approved");const nextIndex=nextAfter>=0?nextAfter:nextBefore;if(nextIndex>=0){active=nextIndex;moved=true}pdfRevision=Date.now()}render();const next=document.getElementById("copyStatus");next.innerHTML=approve?(moved?'已批准并写回源 PDF；已自动切换到下一份待审核报告。':'已批准并写回源 PDF；当前批次已全部审核。'):'草稿、Excel 和审核页面已保存';}catch(error){status.textContent='操作失败：'+error.message;buttons.forEach(button=>button.disabled=false)}}
async function loadReportFolders(){const list=document.getElementById("reportDirOptions");if(!serverConfig||!list)return;try{const response=await fetch('/api/report-folders',{cache:'no-store'});const result=await response.json();if(!response.ok||!result.ok)return;list.innerHTML=result.folders.map(folder=>'<option value="'+esc(folder.path)+'" label="'+esc(folder.name+' · '+folder.pdf_count+' 份 PDF')+'"></option>').join('')}catch{list.innerHTML=''}}
async function selectBatchDirect(){if(!serverConfig)return;const reportDir=document.getElementById("reportDir").value.trim();const batchName=document.getElementById("batchName").value.trim();const inspectionMode=document.getElementById("inspectionMode").value;const autoUpgradeVisual=document.getElementById("autoUpgradeVisual").checked;const meta=document.getElementById("batchMeta");meta.textContent='正在扫描报告文件夹…';try{const response=await fetch('/api/batch/select',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':serverConfig.token},body:JSON.stringify({report_dir:reportDir,batch_name:batchName,inspection_mode:inspectionMode,auto_upgrade_visual:autoUpgradeVisual})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'加载失败');serverConfig.batch=result.batch;reviews=result.reviews;active=0;await loadReportFolders();meta.textContent='已加载 '+result.batch.pdf_count+' 份 PDF，检查模式：'+modeLabel(result.batch.inspection_mode)+'；现有 '+result.batch.review_count+' 份评分记录；结果文件夹：'+result.batch.result_dir;render()}catch(error){meta.textContent='加载失败：'+error.message}}
const modeLabel=mode=>({text_only:'仅文字',smart:'智能检查',full_visual:'完整视觉'}[mode]||'仅文字');
// Batch-level notes describe the batch's settings, not any single report's risk, so they are
// stated once here. The per-report "需要教师复核" box below keeps only the notes that differ
// between reports, which is what makes that box worth reading.
function renderBatchNotices(){const box=document.getElementById("batchInfo");if(!box)return;const list=(batchNotices||[]).filter(Boolean);if(!list.length){box.hidden=true;box.innerHTML="";return}box.hidden=false;box.innerHTML='<strong>本批次设置（对全部报告一致，无需逐份复核）</strong><ul>'+list.map(item=>'<li>'+esc(item)+'</li>').join("")+'</ul>'}
function suggestedBatchName(reportDir){return String(reportDir||'').trim().replace(/[\\/]+$/,'').split(/[\\/]/).filter(Boolean).at(-1)||''}
async function init(){if(location.protocol==='http:'||location.protocol==='https:'){try{const response=await fetch('/api/config',{cache:'no-store'});const config=await response.json();if(response.ok&&config.mode==='local-server'){serverConfig=config;const reviewResponse=await fetch('/api/reviews',{cache:'no-store'});const reviewData=await reviewResponse.json();if(reviewResponse.ok)reviews=reviewData.reviews;if(Array.isArray(config.batch.batch_notices)&&config.batch.batch_notices.length)batchNotices=config.batch.batch_notices;const reportInput=document.getElementById("reportDir");const nameInput=document.getElementById("batchName");reportInput.value=config.batch.report_dir||'';nameInput.value=config.batch.batch_name||config.batch.batch_id||'';autoBatchName=nameInput.value;batchNameTouched=false;reportInput.addEventListener('input',()=>{const suggested=suggestedBatchName(reportInput.value);if(!batchNameTouched||nameInput.value===autoBatchName){nameInput.value=suggested;autoBatchName=suggested;batchNameTouched=false}});nameInput.addEventListener('input',()=>{batchNameTouched=true});document.getElementById("inspectionMode").value=config.batch.inspection_mode||'text_only';document.getElementById("autoUpgradeVisual").checked=config.batch.auto_upgrade_visual===true;document.getElementById("batchMeta").textContent='当前批次：'+config.batch.batch_id+' · '+config.batch.pdf_count+' 份 PDF · 检查模式：'+modeLabel(config.batch.inspection_mode)+' · '+config.batch.review_count+' 份评分记录 · 结果文件夹：'+config.batch.result_dir;document.getElementById("selectBatch").onclick=selectBatchDirect;await loadReportFolders()}}catch{serverConfig=null}}if(!serverConfig)document.getElementById("selectBatch").disabled=true;document.getElementById("search").addEventListener("input",e=>renderList(e.target.value));document.getElementById("quickSelect").addEventListener("change",e=>{syncFromForm();active=+e.target.value;pdfRevision=Date.now();render()});render()}init();
</script></body></html>
