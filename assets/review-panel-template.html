<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>实验报告审核面板</title>
<style>

.batch-bar{max-width:1900px;margin:14px auto 0;padding:0 22px}.batch-box{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:11px 14px;display:grid;grid-template-columns:minmax(260px,1.4fr) minmax(180px,.6fr) auto;gap:10px;align-items:end}.batch-box label{margin:0 0 3px}.batch-box input,.batch-box select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.inspection-settings{grid-column:1/-1;display:flex;gap:18px;align-items:end;padding-top:2px}.inspection-mode{width:min(420px,100%)}.auto-upgrade{display:inline-flex!important;align-items:center;gap:7px;margin:0 0 9px!important;color:var(--muted)!important;font-weight:600!important}.auto-upgrade input{width:16px;height:16px}.batch-meta{grid-column:1/-1;color:var(--muted);font-size:12px}.batch-box .btn{height:40px}
.batch-info{grid-column:1/-1;margin-top:2px;border:1px solid #b9d9eb;background:#f1f8fc;border-radius:10px;padding:9px 13px;color:#385970;font-size:13px}
.batch-info strong{display:block;margin-bottom:3px;color:var(--blue)}
.batch-info ul{margin:3px 0 0;padding-left:19px}.batch-info li{margin:1px 0}
.cleanup-controls{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding-top:2px}.cleanup-controls[hidden]{display:none}.cleanup-controls .btn{padding:7px 11px;font-size:13px;white-space:nowrap;flex:0 0 auto}.cleanup-controls .btn:disabled{cursor:not-allowed;opacity:.55}.cleanup-status{min-width:0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.preflight-info{grid-column:1/-1;border:1px solid #e4c985;background:#fff9e9;border-radius:10px;padding:9px 13px;color:#79520f;font-size:13px}.preflight-info summary{cursor:pointer;font-weight:700}.preflight-info ul{margin:6px 0 0;padding-left:20px}.preflight-info li{margin:3px 0}

.side{align-self:start;position:sticky;top:92px;overflow:hidden}.side-head{padding:14px;border-bottom:1px solid var(--line)}.search,.status-filter{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}.status-filter{margin-top:8px}.report-list{max-height:calc(100vh - 230px);overflow:auto}

.main-card{padding:24px}.review-header{position:sticky;top:74px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:20px;margin:-24px -24px 20px;padding:18px 24px;background:#fff;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 6px 16px #18314912}.hero{min-width:0}.hero h1{margin:0 0 5px;font-size:25px}.meta{color:var(--muted)}.report-path{display:block;max-width:min(100%,760px);margin-top:5px;color:#45627a;font-size:12px;overflow-wrap:anywhere}
.score-box{flex:0 0 auto;min-width:148px;background:#f1f8fc;border:1px solid #b9d9eb;border-radius:12px;padding:9px 15px;text-align:center}.score-box output{display:block;font-size:30px;font-weight:800;color:var(--blue);line-height:1.15}.score-box .adjusted-state{display:block;margin-top:2px;font-size:12px;font-weight:700;color:#1b6b3a}.score-box .adjusted-state b{font-size:15px}.status{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:99px;background:#fff0d5;color:var(--amber);font-size:12px;font-weight:700}.status.approved{background:#e1f4ec;color:var(--green)}.status.resubmit{background:#fde5e3;color:#922d2d}.status .status-detail{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;background:#f6dfb8;color:#7b4e0c;font-size:11px;white-space:nowrap}.preflight-detail{padding:22px}.preflight-detail h1{margin:0 0 8px}.preflight-detail .resubmit-banner{padding:12px 15px;border-radius:10px;background:#fff0ee;border:1px solid #e9b9b5;color:#8d2d2d;font-weight:750}.preflight-detail .ok-banner{padding:12px 15px;border-radius:10px;background:#eaf7f0;border:1px solid #b8ddc9;color:#176344;font-weight:750}
.notice{margin:18px 0;padding:12px 15px;border-left:4px solid #4c9ac4;background:#f0f8fc;color:#385970}.rubric-tools{display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px}.rubric-tools h2{font-size:18px;margin:0}.rubric-grid{display:grid;gap:9px}.rubric{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}.rubric summary{list-style:none;padding:11px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}.rubric summary::-webkit-details-marker{display:none}.rubric summary:before{content:'▸';color:var(--muted);transition:transform .15s}.rubric[open] summary:before{transform:rotate(90deg)}.rubric h3{font-size:15px;margin:0;flex:1}.rubric-detail{padding:0 15px 14px;border-top:1px solid #edf2f5}.score-input{display:flex;align-items:center;gap:5px;white-space:nowrap}.score-input input{width:74px;padding:7px;text-align:right;border:1px solid #aebfcd;border-radius:8px;font-weight:700;color:var(--blue)}
label{display:block;margin:15px 0 6px;font-size:13px;font-weight:700;color:#45627a}textarea{width:100%;min-height:86px;padding:10px;border:1px solid var(--line);border-radius:9px;resize:vertical;background:#fbfdfe;color:var(--ink)}.evidence{margin:7px 0 0;padding-left:19px;color:#50687b;font-size:13px}.evidence li+li{margin-top:3px}

.writeback-options{display:flex;flex-wrap:nowrap;align-items:center;gap:8px 12px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#f7fafc;font-size:13px;overflow-x:auto}.writeback-options[hidden]{display:none}.writeback-options strong{color:var(--blue);margin-right:4px;white-space:nowrap}.writeback-options label{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-weight:500;white-space:nowrap}.writeback-options input{accent-color:var(--blue)}.writeback-options .position-choice select{padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}.skip-confirm-wrap{display:inline-flex;align-items:center;gap:7px;margin-left:2px;padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}.skip-confirm-title{color:var(--blue);font-size:12px;font-weight:700;white-space:nowrap}.skip-confirm{display:inline-flex;align-items:center;gap:7px;margin:0;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}.skip-confirm input{position:absolute;opacity:0;pointer-events:none}.skip-switch{width:32px;height:18px;flex:none;border-radius:99px;background:#c7d3dc;position:relative;transition:.18s}.skip-switch:after{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.18s}.skip-confirm input:checked+.skip-switch{background:var(--green)}.skip-confirm input:checked+.skip-switch:after{transform:translateX(14px)}.skip-confirm input:focus-visible+.skip-switch{outline:3px solid #8fc7e6;outline-offset:2px}.preview-modal[hidden]{display:none}.preview-modal{position:fixed;inset:0;z-index:50;background:#10283dcc;display:grid;place-items:center;padding:20px}.preview-card{width:min(1200px,96vw);height:min(92vh,950px);background:#fff;border-radius:15px;box-shadow:0 22px 70px #0005;display:flex;flex-direction:column;overflow:hidden}.preview-top{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.preview-top h2{font-size:19px;margin:0}.preview-order{padding:8px 18px;background:#f1f8fc;color:#385970;font-size:13px}.preview-frame{flex:1;min-height:0;width:100%;border:0}.preview-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-top:1px solid var(--line)}.preview-footer label{display:flex;align-items:center;gap:8px;font-size:13px}.preview-buttons{display:flex;gap:9px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.ghost{background:#eaf1f6;color:var(--ink)}.copy-status{align-self:center;color:var(--green);font-size:13px}.empty{padding:24px;color:var(--muted)}
.pdf-pane{align-self:start;position:sticky;top:92px;height:calc(100vh - 114px);overflow:hidden;display:flex;flex-direction:column}.pdf-head{min-height:54px;padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.pdf-head h2{font-size:15px;margin:0}.pdf-head span{color:var(--muted);font-size:12px}.pdf-head a{margin-left:auto;color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}.pdf-head a:hover{text-decoration:underline}.pdf-pane iframe{border:0;width:100%;flex:1;background:#dfe6eb}.pdf-fallback{display:none;padding:18px;color:var(--muted)}
@media(max-width:1500px){.layout{grid-template-columns:minmax(0,1fr) minmax(420px,48vw)}.side{grid-column:1/-1;position:static}.side-head{padding:12px;display:grid;grid-template-columns:1fr 240px;gap:10px}.status-filter{margin:0}.report-list{display:flex;max-height:none;overflow-x:auto}.report-row{min-width:230px;border-right:1px solid #e7eef3}.pdf-pane{grid-column:2;grid-row:2}.main-card{grid-column:1;grid-row:2}}
@media(max-width:850px){.writeback-options{flex-wrap:wrap;overflow-x:visible}.layout{grid-template-columns:1fr}.side,.main-card,.pdf-pane{grid-column:1;grid-row:auto;position:static}.pdf-pane{height:76vh}.top-inner{flex-wrap:wrap}.cols{grid-template-columns:1fr}.batch-box{grid-template-columns:1fr}.inspection-settings{grid-column:1;display:grid;gap:4px}.batch-meta{grid-column:1}.approval-option{justify-content:flex-start}.side-head{grid-template-columns:1fr}.review-header{top:64px;align-items:flex-start;padding:14px 16px;margin:-24px -24px 18px}.hero h1{font-size:21px}.score-box{min-width:112px;padding:8px 10px}.score-box output{font-size:25px}}
@media print{.top,.side,.actions,.notice,.pdf-pane{display:none}.layout{display:block;margin:0;padding:0}.main-card{border:0;box-shadow:none}.rubric-grid{grid-template-columns:1fr 1fr}}
.layout.pdf-wide{grid-template-columns:230px minmax(400px,1fr) minmax(650px,50vw)}.pdf-head{gap:9px}.pdf-width-toggle{border:1px solid var(--line);border-radius:8px;background:#f4f8fb;color:var(--blue);padding:6px 9px;font-weight:700;white-space:nowrap}.pdf-width-toggle[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff} @media(max-width:1500px){.layout.pdf-wide{grid-template-columns:minmax(0,1fr) minmax(520px,55vw)}}@media(max-width:850px){.layout.pdf-wide{grid-template-columns:1fr}}
.approval-dialog[hidden]{display:none}.approval-dialog{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:#10283dcc}.approval-card{width:min(480px,100%);padding:24px;background:#fff;border-radius:16px;box-shadow:0 22px 70px #0005}.approval-card h2{margin:0 0 12px;font-size:21px}.approval-card p{margin:8px 0;color:var(--muted)}.approval-target{overflow-wrap:anywhere;font-weight:700;color:var(--ink)!important}.approval-score{padding:10px 12px;border:1px solid #e4c985;border-radius:9px;background:#fff9e9;color:#79520f!important}.approval-continuous{display:flex;align-items:center;gap:10px;margin:18px 0 4px;font-size:14px;color:var(--ink);cursor:pointer}.approval-continuous input{width:18px;height:18px;accent-color:var(--green)}.approval-help{font-size:12px}.approval-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}.btn:disabled{opacity:.55;cursor:not-allowed}
</style>

<body>
<header class="top"><div class="top-inner"><div><div class="title">实验报告审核面板</div></div></div></header>
<section class="batch-bar"><div class="batch-box"><div><label for="reportDir">实验报告文件夹</label><input id="reportDir" list="reportDirOptions" autocomplete="off" placeholder="输入路径，或点击右侧箭头选择"><datalist id="reportDirOptions"></datalist></div><div><label for="batchName">实验批次名称</label><input id="batchName" placeholder="例如 2026秋-实验1"></div><button class="btn primary" id="selectBatch">加载 / 创建批次</button><div class="batch-meta" id="batchMeta">当前审核批次信息。</div><div class="cleanup-controls" id="cleanupControls" hidden><button class="btn ghost" id="cleanupWorkBtn" type="button" disabled>清理评分暂存文件</button><span class="cleanup-status" id="cleanupStatus">审核完成后可清理 skill 生成的评分暂存目录。</span></div><div class="batch-info" id="batchInfo" hidden></div><details class="preflight-info" id="preflightInfo" hidden></details></div><div class="writeback-options" id="writebackOptions" hidden><strong>写回 PDF 设置</strong><label><input type="checkbox" id="wbHandwrittenComments" title="把各分项评语写到其页码证据对应的原报告页空白处"> 原页手写分项评语（可选）</label><label><input type="checkbox" id="wbCheckmarks" checked> 逐页画勾</label><label><input type="checkbox" id="wbSignature" checked> 加盖教师签名</label><label><input type="checkbox" id="wbScore" checked> 手写填写成绩</label><label class="position-choice">反馈页位置 <select id="wbFeedbackPosition"><option value="first">插入首页</option><option value="last">追加到末页</option></select></label><div class="skip-confirm-wrap"><span class="skip-confirm-title">连续审批</span><label class="skip-confirm" title="开启后，本批次连续审批时不再逐份弹出确认"><input type="checkbox" id="skipConfirm"><span class="skip-switch" aria-hidden="true"></span><span>不再提示</span></label></div></div></section>
<div class="layout" id="reviewLayout"><aside class="side"><div class="side-head"><input id="search" class="search" placeholder="搜索姓名、学号或文件名"><select id="statusFilter" class="status-filter" aria-label="按状态筛选"><option value="all">全部状态</option><option value="待审核">待审核</option><option value="已审核">已审核</option><option value="resubmit">需重新提交</option><option value="已重新提交">已重新提交</option></select></div><div id="reportList" class="report-list"></div></aside><main id="main" class="main-card"></main><section class="pdf-pane" aria-label="实验报告 PDF"><div class="pdf-head"><div><h2>当前源 PDF</h2><span id="pdfName"></span></div><button class="pdf-width-toggle" id="togglePdfWidth" type="button" aria-pressed="false">PDF 加宽</button><a id="openPdf" target="_blank" rel="noreferrer">新窗口打开</a></div><iframe id="pdfFrame" title="实验报告 PDF"></iframe><div class="pdf-fallback">当前浏览器无法内嵌 PDF，请点击“新窗口打开”。</div></section></div>
<div class="approval-dialog" id="approvalDialog" role="dialog" aria-modal="true" aria-labelledby="approvalTitle" hidden><div class="approval-card"><h2 id="approvalTitle">确认评分裁决并写回</h2><p class="approval-target" id="approvalTarget"></p><p class="approval-score" id="approvalScore"></p><p>请确认已核对页面中的双评差异，并以当前分数作为最终裁决。确认后会先备份原 PDF，再写回反馈。</p><label class="approval-continuous"><input type="checkbox" id="skipDisputeConfirm"> 本批次后续分歧报告开启连续裁决</label><p class="approval-help">开启后，后续仍需逐份点击“确认裁决并写回 PDF”，但不再弹出此确认框。仅在本次浏览器会话内有效。</p><div class="approval-actions"><button class="btn ghost" id="cancelApproval" type="button">取消</button><button class="btn success" id="confirmApproval" type="button">确认裁决并写回 PDF</button></div></div></div>

<script>
let reviews=__REVIEWS_JSON__; let batchNotices=__BATCH_NOTICES_JSON__; let preflightItems=__PREFLIGHT_JSON__; let active=0; let activePreflight=null; let pdfRevision=0;
let serverConfig=null; let batchNameTouched=false; let autoBatchName="";let pendingPreviewId=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const listText=a=>(a||[]).join("\n");
function renderFigureEvidence(d){return (d.figures||[]).length?'<ul class="evidence">'+d.figures.map(f=>'<li>'+esc(f.id)+'：'+esc(f.reason)+'（'+esc((f.requirements||[]).join(', '))+'）</li>').join('')+'</ul>':'';}
function renderRegradeDispute(r){const d=r.regrade_dispute;if(!d)return '';const ledger=entries=>(entries||[]).length?'<ul>'+entries.map(x=>'<li>'+esc(x.rule)+' −'+esc(x.points)+'分 · '+esc((x.requirements||[]).join(', '))+'：'+esc(x.reason)+'（'+esc((x.evidence||[]).join(', '))+'）'+renderFigureEvidence(x)+'</li>').join('')+'</ul>':'<p>没有扣分事实</p>';return '<section class="section warnings"><details><summary>两次盲评依据对比（'+esc(d.primary_total)+' / '+esc(d.recheck_total)+'分）</summary><h3>首次</h3>'+ledger(d.primary_deductions)+'<h3>复评</h3>'+ledger(d.recheck_deductions)+'</details></section>';}
function pdfUrl(r){if(serverConfig)return '/api/pdf?review_file='+encodeURIComponent(r.__review_file);const source=String(r.source_file||"").replace(/\\/g,"/");if(/^file:/i.test(source))return source;if(/^[A-Za-z]:\//.test(source)){const parts=source.split("/");return "file:///"+parts.map((part,i)=>i===0?part:encodeURIComponent(part)).join("/")}const encoded=source.split("/").map(encodeURIComponent).join("/");return new URL(encoded,new URL("../../",location.href)).href}
function updatePdf(r){const base=pdfUrl(r);const url=base+(base.includes('?')?'&':'?')+'v='+pdfRevision;document.getElementById("pdfFrame").src=url;document.getElementById("openPdf").href=url;document.getElementById("pdfName").textContent=r.student_name+' · '+r.student_id}
function total(r){return r.items.reduce((s,x)=>s+(Number(x.score)||0),0)}
const fmtScore=v=>Number(v).toFixed(1).replace(/\.0$/,"");
function adjusted(r){const off=Number(r.score_offset)||0;if(!(off>0))return null;return Math.min(Number(r.max_score),total(r)+off)}

async function saveDirect(){syncFromForm();const r=reviews[active];const status=document.getElementById("copyStatus");const buttons=document.querySelectorAll(".actions button");buttons.forEach(button=>button.disabled=true);status.textContent="正在保存草稿并更新 Excel…";try{const response=await fetch("/api/review",{method:"POST",headers:{"Content-Type":"application/json","X-Review-Token":serverConfig.token},body:JSON.stringify({action:"save_draft",review_file:r.__review_file,review:r})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"保存失败");reviews[active]=result.review;render();document.getElementById("copyStatus").textContent="草稿、Excel 和审核页面已保存"}catch(error){status.textContent="保存失败："+error.message;buttons.forEach(button=>button.disabled=false)}}
function togglePdfWidth(){const layout=document.getElementById("reviewLayout");const button=document.getElementById("togglePdfWidth");const enabled=layout.classList.toggle("pdf-wide");button.setAttribute("aria-pressed",String(enabled));button.textContent=enabled?"恢复 PDF 宽度":"PDF 加宽"}function renderBatchNotices(){const box=document.getElementById("batchInfo");if(!box)return;const list=(batchNotices||[]).filter(Boolean);if(!list.length){box.hidden=true;box.innerHTML="";return}box.hidden=false;box.innerHTML='<strong>本批次设置（对全部报告一致，无需逐份复核）</strong><ul>'+list.map(item=>'<li>'+esc(item)+'</li>').join("")+'</ul>'}
function renderPreflight(){const box=document.getElementById("preflightInfo");if(!box)return;const list=(preflightItems||[]).filter(x=>x.status!=="可进入评分"&&x.status!=="未纳入评分（已收到 PDF）");if(!list.length){box.hidden=true;box.innerHTML="";return}box.hidden=false;box.innerHTML='<summary>提交预检：'+list.length+' 项需处理 · 点击查看</summary><ul>'+list.map(x=>'<li><strong style="color:#a33c3c">'+esc(x.status)+'</strong> · '+esc(x.file)+' · '+esc([x.student_name,x.student_id].filter(Boolean).join(" / ")||"未识别身份")+(x.experiment?' · '+esc(x.experiment):'')+(resubmissionHint(x)?'<br><span class="preflight-hint">'+esc(resubmissionHint(x).replace(/^ · /,''))+'</span>':'')+(x.reasons?.length?' — '+esc(x.reasons.join("；")):'')+'</li>').join("")+'</ul>'}
function suggestedBatchName(reportDir){return String(reportDir||'').trim().replace(/[\\/]+$/,'').split(/[\\/]/).filter(Boolean).at(-1)||''}
async function init(){if(location.protocol==='http:'||location.protocol==='https:'){try{const response=await fetch('/api/config',{cache:'no-store'});const config=await response.json();if(response.ok&&config.mode==='local-server'){serverConfig=config;document.getElementById('writebackOptions').hidden=false;const skipConfirm=document.getElementById('skipConfirm');const skipKey='skip-approval-confirm:'+config.batch.batch_id;skipConfirm.checked=sessionStorage.getItem(skipKey)==='1';skipConfirm.addEventListener('change',()=>sessionStorage.setItem(skipKey,skipConfirm.checked?'1':'0'));const reviewResponse=await fetch('/api/reviews',{cache:'no-store'});const reviewData=await reviewResponse.json();if(reviewResponse.ok)reviews=reviewData.reviews;if(Array.isArray(config.batch.batch_notices)&&config.batch.batch_notices.length)batchNotices=config.batch.batch_notices;preflightItems=Array.isArray(config.batch.submission_preflight)?config.batch.submission_preflight:[];const reportInput=document.getElementById("reportDir");const nameInput=document.getElementById("batchName");reportInput.value=config.batch.report_dir||'';nameInput.value=config.batch.batch_name||config.batch.batch_id||'';autoBatchName=nameInput.value;batchNameTouched=false;reportInput.addEventListener('input',()=>{const suggested=suggestedBatchName(reportInput.value);if(!batchNameTouched||nameInput.value===autoBatchName){nameInput.value=suggested;autoBatchName=suggested;batchNameTouched=false}});nameInput.addEventListener('input',()=>{batchNameTouched=true});document.getElementById("batchMeta").textContent='当前批次：'+config.batch.batch_id+' · '+config.batch.pdf_count+' 份 PDF · '+config.batch.review_count+' 份评分记录 · 结果文件夹：'+config.batch.result_dir;document.getElementById("selectBatch").onclick=selectBatchDirect;await loadReportFolders();document.getElementById("cleanupControls").hidden=false;document.getElementById("cleanupWorkBtn").onclick=cleanBatchWorkFromPanel;await refreshCleanupControl()}}catch{serverConfig=null}}if(!serverConfig)document.getElementById("selectBatch").disabled=true;document.getElementById("search").addEventListener("input",renderList);document.getElementById("statusFilter").addEventListener("change",renderList);document.getElementById("togglePdfWidth").addEventListener("click",togglePdfWidth);render()}init();
</script></body></html>
